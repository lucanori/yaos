services:
  yaos-app:
    build:
      context: ../..
      dockerfile: deployment/ops/Dockerfile
    container_name: yaos-app
    hostname: yaos-app
    user: bun
    working_dir: /app
    command:
      - /app/bin/start-server.sh
    environment:
      DATABASE_URL: postgresql://yaos:${POSTGRES_PASSWORD}@postgres:5432/yaos
      PORT: "3000"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_BUCKET: yaos-dev
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      YAOS_CANONICAL_REPO: kavinsood/yaos
    env_file:
      - path: ./.env
        required: false
    ports:
      - 127.0.0.1:3000:3000
    expose:
      - "3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - yaos-edge
      - yaos-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/capabilities >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    labels:
      com.yaos.role: app
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

  postgres:
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    container_name: yaos-postgres
    hostname: postgres
    user: postgres
    command:
      - postgres
      - -c
      - max_connections=200
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: yaos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: yaos
    env_file:
      - path: ./.env
        required: false
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - yaos-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    networks:
      - yaos-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaos -d yaos -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    labels:
      com.yaos.role: postgres
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    container_name: yaos-redis
    hostname: redis
    user: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - "60"
      - "1000"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    env_file:
      - path: ./.env
        required: false
    volumes:
      - yaos-redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - yaos-backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    labels:
      com.yaos.role: redis
    profiles:
      - redis
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: yaos-minio
    hostname: minio
    user: 65534:65534
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      HOME: /tmp
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    env_file:
      - path: ./.env
        required: false
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    tmpfs:
      - /data:rw,noexec,nosuid,size=512m,uid=65534,gid=65534
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - yaos-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    labels:
      com.yaos.role: s3
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: yaos-minio-init
    hostname: minio-init
    user: 65534:65534
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - mc --config-dir /tmp/.mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc --config-dir /tmp/.mc mb --ignore-existing local/yaos-dev
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    env_file:
      - path: ./.env
        required: false
    tmpfs:
      - /.mc:rw,noexec,nosuid,size=16m,uid=65534,gid=65534
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - yaos-backend
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    labels:
      com.yaos.role: s3-bootstrap
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"

networks:
  yaos-edge:
    driver: bridge
  yaos-backend:
    driver: bridge
    internal: true

volumes:
  yaos-postgres-data:
  yaos-redis-data:
