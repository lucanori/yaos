name: Self-hosted path validation

on:
  push:
    paths:
      - 'server/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'docker/**'
      - '.env.example'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'server/package.json'
      - 'server/bun.lock'
      - 'server/tsconfig.json'
      - 'tsconfig.json'
      - '.github/workflows/self-hosted-path.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate self-hosted path
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yaos
          POSTGRES_PASSWORD: yaos
          POSTGRES_DB: yaos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U yaos -d yaos_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://yaos:yaos@127.0.0.1:5432/yaos_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Run self-hosted validations
        run: bun run test:ci
