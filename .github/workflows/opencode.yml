name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - run: curl -fsSL https://raw.githubusercontent.com/one-ring-ai/dotfiles/main/.config/opencode/setup.sh | bash

      - run: '[ -f "$HOME/.config/opencode/setup.sh" ]'

      - name: Setup OpenCode secrets
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
        run: |
          mkdir -p ~/.config/opencode/.secrets
          echo "$FIGMA_TOKEN" > ~/.config/opencode/.secrets/figma-token
          echo "$REPLICATE_TOKEN" > ~/.config/opencode/.secrets/replicate-key

      - name: Configure git for HTTPS with token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/gpt-5.1-codex-max
          agent: orchestrator
          use_github_token: true
